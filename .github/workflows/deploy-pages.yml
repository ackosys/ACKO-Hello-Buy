name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build root (no video BG, logo visible)
        run: npm run build
        env:
          GITHUB_PAGES: 'true'

      - name: Copy root build to deploy folder
        run: |
          mkdir -p deploy
          cp -r out/. deploy/

      - name: Build newhomepage (animated BG, logo hidden)
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
          DEPLOY_SUBPATH: 'newhomepage'

      - name: Copy newhomepage build into deploy/newhomepage/
        run: |
          mkdir -p deploy/newhomepage
          cp -r out/. deploy/newhomepage/

      - name: Deploy combined build to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
